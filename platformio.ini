; PlatformIO Project Configuration
; ESP32 TROLL BOX
; Ghost Writer + Mouse Jiggler + TV-B-Gone

[env:esp32s2]
platform = espressif32
board = esp32-s2-saola-1
framework = arduino
monitor_speed = 115200
build_flags = 
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; Para ESP32-S3 (también soporta USB HID nativo)
[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
build_flags = 
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; ⚠️ IMPORTANTE: 
; El ESP32 clásico (WROOM-32D) NO tiene USB HID nativo
; Para usar Ghost Writer y Mouse Jiggler necesitas:
; - ESP32-S2 o ESP32-S3 (tienen USB OTG nativo)
; - O usar un módulo CH9329 (UART to USB HID)
;
; El TV-B-Gone funciona en cualquier ESP32
